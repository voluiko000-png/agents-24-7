name: Persona Hub (Mia, Leo)

on:
  schedule:
    - cron: '30 8 * * 1,3,5'  # пн/ср/пт, 11:30 MSK -- сдвинуто от Норы, чтобы не биться за rate limit Pollinations
  workflow_dispatch:

jobs:
  personas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Post Mia + Leo content
        working-directory: src/agents/persona_hub
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: |
          python poster.py mia
          python poster.py leo

      - name: Commit rotation state back to repo
        working-directory: src/agents/persona_hub
        run: |
          git config user.name "persona-hub-bot"
          git config user.email "actions@github.com"
          git add personas/mia_config.json personas/leo_config.json
          git diff --cached --quiet || git commit -m "auto: persona post_index update"
          git push
