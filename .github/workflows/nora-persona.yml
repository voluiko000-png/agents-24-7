name: Nora Lind AI Persona

on:
  schedule:
    - cron: '0 8 * * 1,3,5'  # пн/ср/пт, 11:00 MSK -- ритм из CONTENT_PLAN_M1-3.md
  workflow_dispatch:

jobs:
  nora:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Post Nora content
        working-directory: src/agents/nora_persona
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: python nora_poster.py

      - name: Commit rotation state back to repo
        working-directory: src/agents/nora_persona
        run: |
          git config user.name "nora-persona-bot"
          git config user.email "actions@github.com"
          git add nora_config.json
          git diff --cached --quiet || git commit -m "auto: nora post_index update"
          git push
